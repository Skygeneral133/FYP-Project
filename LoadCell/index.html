<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Arduino Load Cell BLE Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 60px;
            background: #f5f5f5;
        }

        h1 {
            font-size: 32px;
        }

        #status {
            margin: 20px;
            font-size: 20px;
        }

        #weight {
            font-size: 64px;
            font-weight: bold;
            margin: 40px;
        }

        button {
            font-size: 20px;
            padding: 15px 30px;
            cursor: pointer;
        }

        #rawData {
            margin-top: 30px;
            font-family: monospace;
        }
    </style>
</head>


<body>
    <h1>Arduino Load Cell BLE Test</h1>
    <div id="status">
        Status: Disconnected
    </div>

    <button onclick="connectBLE()">
        Connect to Arduino
    </button>

    <div id="weight">
        -- g
    </div>

    <div id="rawData">
        Waiting for data...
    </div>


<script>
    // BLE UUIDs
    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

    // Variables
    let device = null;
    let characteristic = null;

    // Connect to Arduino
    async function connectBLE() {
        try {
            document.getElementById("status").innerText = "Status: Searching for Arduino...";

            // Request BLE device
            device = await navigator.bluetooth.requestDevice({
                filters: [{name: "LoadCellArduino"}],
                optionalServices: [SERVICE_UUID]
            });

            console.log("Device found:", device.name);

            // Connect
            document.getElementById("status").innerText = "Status: Connecting...";
            const server = await device.gatt.connect();

            // Get service
            const service = await server.getPrimaryService(SERVICE_UUID);

            // Get characteristic
            characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            // Listen for notifications
            await characteristic.startNotifications();
            characteristic.addEventListener("characteristicvaluechanged", handleWeight);
            document.getElementById("status").innerText = "Status: Connected";
            console.log("BLE connected!");
        }

        catch (error) {
            console.error(error);
            document.getElementById("status").innerText = "Status: Error - " + error;
        }
    }

    // Receive weight data from Arduino
    function handleWeight(event) {
        const value = new TextDecoder().decode(event.target.value);
        const weight = parseFloat(value);
        console.log("Received:", value);

        // Update weight
        if (!isNaN(weight)) {
            document.getElementById("weight").innerText = weight.toFixed(2) + " g";
        }

        // Raw data
        document.getElementById("rawData").innerText = "BLE Data: " + value;
    }

</script>
</body>
</html>
