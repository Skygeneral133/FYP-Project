<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Arduino BLE - IMU + Load Cell</title>
<style>body{font-family:Arial;text-align:center;margin-top:50px;background:#f5f5f5}.sensor{display:inline-block;width:350px;margin:20px;padding:25px;background:white;border-radius:12px}.value{font-size:48px;font-weight:bold;margin:25px}.status{margin:15px;font-size:18px}button{font-size:18px;padding:12px 25px;cursor:pointer}#rawData{margin-top:30px;font-family:monospace}</style></head>
<body><h1>Arduino BLE Sensors</h1>
<div class="sensor"><h2>IMU</h2><div id="imuStatus" class="status">Disconnected</div><button onclick="connectIMU()">Connect IMU</button><div id="angle" class="value">-- °</div><div>Z Angle</div></div>
<div class="sensor"><h2>Load Cell</h2><div id="loadStatus" class="status">Disconnected</div><button onclick="connectLoadCell()">Connect Load Cell</button><div id="weight" class="value">-- g</div></div>
<div id="rawData">Waiting for data...</div>
<script>
const SERVICE_UUID="19b10000-e8f2-537e-4f6c-d104768a1214";
const CHARACTERISTIC_UUID="19b10001-e8f2-537e-4f6c-d104768a1214";
let imuDevice=null,imuCharacteristic=null,loadDevice=null,loadCharacteristic=null;
async function connectIMU(){try{document.getElementById("imuStatus").innerText="Searching...";imuDevice=await navigator.bluetooth.requestDevice({filters:[{name:"IMUArduino"}],optionalServices:[SERVICE_UUID]});document.getElementById("imuStatus").innerText="Connecting...";const server=await imuDevice.gatt.connect();const service=await server.getPrimaryService(SERVICE_UUID);imuCharacteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);await imuCharacteristic.startNotifications();imuCharacteristic.addEventListener("characteristicvaluechanged",handleIMU);document.getElementById("imuStatus").innerText="Connected";}catch(error){console.error(error);document.getElementById("imuStatus").innerText="Error: "+error.message;}}
function handleIMU(event){const angle=event.target.value.getFloat32(0,true);document.getElementById("angle").innerText=angle.toFixed(2)+" °";document.getElementById("rawData").innerText="IMU Angle: "+angle.toFixed(2)+"°";}
async function connectLoadCell(){try{document.getElementById("loadStatus").innerText="Searching...";loadDevice=await navigator.bluetooth.requestDevice({filters:[{name:"LoadCellArduino"}],optionalServices:[SERVICE_UUID]});document.getElementById("loadStatus").innerText="Connecting...";const server=await loadDevice.gatt.connect();const service=await server.getPrimaryService(SERVICE_UUID);loadCharacteristic=await service.getCharacteristic(CHARACTERISTIC_UUID);await loadCharacteristic.startNotifications();loadCharacteristic.addEventListener("characteristicvaluechanged",handleLoadCell);document.getElementById("loadStatus").innerText="Connected";}catch(error){console.error(error);document.getElementById("loadStatus").innerText="Error: "+error.message;}}
function handleLoadCell(event){const value=new TextDecoder().decode(event.target.value);const weight=parseFloat(value);if(!isNaN(weight))document.getElementById("weight").innerText=weight.toFixed(2)+" g";document.getElementById("rawData").innerText="Load Cell: "+value;}
</script></body></html>
